apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-image-renderer
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grafana-image-renderer
  template:
    metadata:
      labels:
        app: grafana-image-renderer
        monitoring: enabled
    spec:
      containers:
        - name: renderer
          image: grafana/grafana-image-renderer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: HTTP_HOST
              value: 0.0.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-image-renderer
  namespace: observability
spec:
  selector:
    app: grafana-image-renderer
  ports:
    - name: http
      port: 8081
      targetPort: 8081
