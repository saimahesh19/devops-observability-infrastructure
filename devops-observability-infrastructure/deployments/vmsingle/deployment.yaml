apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmsingle
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmsingle
  template:
    metadata:
      labels:
        app: vmsingle
        monitoring: enabled
    spec:
      containers:
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.126.0
          args:
            - -storageDataPath=/storage
          ports:
            - name: http
              containerPort: 8428
          volumeMounts:
            - name: storage
              mountPath: /storage
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vmsingle
  namespace: observability
  labels:
    monitoring: enabled
spec:
  selector:
    app: vmsingle
  ports:
    - name: http
      port: 8428
      targetPort: 8428
