apiVersion: v1
kind: ConfigMap
metadata:
  name: vmsingle-config
  namespace: observability
data:
  scrape.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: vmsingle
        static_configs:
          - targets:
              - vmsingle:8428

      - job_name: memcached-exporter
        static_configs:
          - targets:
              - memcached-exporter:9150
